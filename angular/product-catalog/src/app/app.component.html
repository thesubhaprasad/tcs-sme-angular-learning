<main class="page">
  <app-page-header day="02" title="Product Catalog with reusable components"
    subtitle="Inputs, content projection, conditions and stable lists." date="13 October 2026" />
  <app-product-summary [products]="products" />
  <app-section title="Shop products" headingId="catalog-heading">
    <!-- The wrapper projects both this paragraph and the reusable product list. -->
    <p class="stock-note">Stock selection: {{ selectedStock }}</p>
    <app-product-list [products]="visibleProducts" [showCategory]="showCategory" />
  </app-section>
  <app-section title="Learning notes" headingId="notes-heading">
    <p>Inputs travel down. The same Section wrapper displays different nested content.</p>
  </app-section>
  <aside class="exercise"><h2>Your turn</h2><p>Add a brand and a showBrand input, then forward it through ProductList.</p></aside>
</main>
